name: Release MyOpenKey

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Universal Binary & Package Installer
        run: |
          chmod +x build_release.sh
          ./build_release.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.txt
            dist/*.xml
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Update appcast.xml on master branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          cp dist/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "Update Sparkle appcast.xml for ${{ github.ref_name }}" || true
          git push origin master || true
